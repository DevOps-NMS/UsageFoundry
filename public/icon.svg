<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="UsageFoundry">
  <!-- Three rising bars: the usage meter the app is built around, and the same
       mark Nav.tsx draws inline. One hue at two lightnesses rather than the
       blue-to-violet ramp this had — a two-hue gradient reads as a smear at
       16px in a tab strip, which is where this spends its life. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b82e8"/>
      <stop offset="1" stop-color="#0b6bcb"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#tile)"/>
  <rect x="8"  y="18" width="4" height="7"  rx="2" fill="#fff"/>
  <rect x="14" y="13" width="4" height="12" rx="2" fill="#fff"/>
  <rect x="20" y="7"  width="4" height="18" rx="2" fill="#fff"/>
</svg>
